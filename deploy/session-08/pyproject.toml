[project]
name = "course-project-deploy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain==1.3.14",
  "langchain-core==1.5.3",
  "langgraph==1.2.9",
  "langchain-openai==1.4.1",
  "langchain-google-genai==4.3.1",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary,pool]==3.3.4",
  "langmem==0.0.30",
  "langfuse==4.14.1",
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "httpx==0.28.1",
  "aiogram==3.30.0",
  "python-dotenv==1.2.2",
  "mistune>=3,<4",
]
[dependency-groups]
dev = ["pytest==9.1.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
